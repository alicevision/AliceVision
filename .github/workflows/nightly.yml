name: Nightly

on:
  schedule:
    # Every day at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

# Cancel any in-progress nightly run if a new one is triggered
concurrency:
  group: nightly
  cancel-in-progress: true

jobs:

  # ───────────────────────────────────────────────
  # 0. Skip scheduled runs when the nightly already holds this commit
  # ───────────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Compare the nightly tag with the commit to build
        id: check
        run: |
          # The tag only moves after a full publish (last step of publish-nightly).
          TAG_SHA=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/tags/nightly | cut -f 1)
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$TAG_SHA" = "$GITHUB_SHA" ]; then
            echo "Nightly already published for ${GITHUB_SHA}: skip."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  # ───────────────────────────────────────────────
  # 1. Build & archive (archives created inside each build workflow)
  # ───────────────────────────────────────────────
  build-linux:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/build-linux.yml

  build-windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/build-windows.yml

  # ───────────────────────────────────────────────
  # 2. Publish to the "nightly" GitHub Release
  # ───────────────────────────────────────────────
  publish-nightly:
    needs: [build-linux, build-windows]
    # Manual runs on other branches only build: never publish them as the develop nightly.
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create/edit releases and push tags

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history for changelog

      - name: Download Linux package
        uses: actions/download-artifact@v8
        with:
          name: linux-package
          path: dist

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: windows-package
          path: dist

      # ── Metadata ────────────────────────────────
      - name: Compute release metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          NOW=$(date -u +'%Y-%m-%d %H:%M UTC')
          BUILD_LABEL=$(date -u +%Y%m%d)-${SHORT_SHA}
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "now=${NOW}" >> $GITHUB_OUTPUT
          echo "build_label=${BUILD_LABEL}" >> $GITHUB_OUTPUT

      # ── Ensure release exists ────────────────────
      - name: Ensure nightly release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view nightly --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release create nightly \
              --repo "${{ github.repository }}" \
              --title "Nightly Build" \
              --notes "Nightly build — will be updated by CI." \
              --prerelease
          fi

      # ── Delete stale assets ──────────────────────
      - name: Delete existing release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' \
          | while read -r ASSET; do
              echo "  → Deleting asset: $ASSET"
              gh release delete-asset nightly "$ASSET" \
                --repo "$GITHUB_REPOSITORY" --yes
            done

      # ── Upload fresh assets ──────────────────────
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload nightly dist/* \
            --repo "${{ github.repository }}" \
            --clobber

      # ── Write release notes to file ──────────────
      - name: Write release notes
        run: |
          NOW="${{ steps.meta.outputs.now }}"
          SHORT_SHA="${{ steps.meta.outputs.short_sha }}"
          # CUDA versions come from the build workflows, so the notes cannot drift from them.
          LINUX_CUDA=$(grep -oP 'image: ".*-cuda\K[0-9.]+' .github/workflows/build-linux.yml)
          WINDOWS_CUDA=$(grep -oP "CUDA_VERSION: '\K[^']+" .github/workflows/build-windows.yml)
          # List the files actually downloaded, not names rebuilt from today's date.
          ASSET_ROWS=$(for FILE in dist/*; do
            NAME=$(basename "$FILE")
            case "$NAME" in
              *-linux.*)   PLATFORM="Linux (Rocky 9, CUDA ${LINUX_CUDA})" ;;
              *-windows.*) PLATFORM="Windows (CUDA ${WINDOWS_CUDA})" ;;
              *)           PLATFORM="" ;;
            esac
            echo "| \`${NAME}\` | ${PLATFORM} |"
          done)
          cat > nightly_release_notes.md << EOF
          > [!WARNING]
          > **Automated nightly build** from the \`develop\` branch. May be unstable.

          | | |
          |---|---|
          | Date   | ${NOW} |
          | Commit | [${SHORT_SHA}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) |
          | Branch | \`develop\` |

          ### Assets

          | File | Platform |
          |------|----------|
          ${ASSET_ROWS}
          EOF

      # ── Update release from file ──────────────────
      - name: Update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit nightly \
            --repo "${{ github.repository }}" \
            --title "Nightly Build (${{ steps.meta.outputs.build_label }})" \
            --notes-file nightly_release_notes.md \
            --prerelease

      # ── Move the nightly tag to the built commit ─
      # The release's "Source code" archives come from this tag.
      # Last step: the "check" job skips the next scheduled run only if this whole publish succeeded.
      - name: Move nightly tag
        run: |
          git tag -f nightly "${GITHUB_SHA}"
          git push -f origin refs/tags/nightly

